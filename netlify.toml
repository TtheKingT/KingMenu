[build]
  command = "mkdir -p dist && cp index.html admin-login.html admin-panel.html dist/ && cp -r css js dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://ajax.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net https://firebasestorage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebaseinstallations.googleapis.com https://firebaseappcheck.googleapis.com https://content-firebaseappcheck.googleapis.com https://recaptchaenterprise.googleapis.com https://www.google.com https://www.recaptcha.net https://cdn.jsdelivr.net https://raw.githubusercontent.com https://modelviewer.dev https://images.unsplash.com wss://*.firebaseio.com wss://firestore.googleapis.com; frame-src https://*.firebaseapp.com https://www.google.com/recaptcha/ https://www.recaptcha.net/recaptcha/; worker-src 'self' blob:; media-src 'self' blob:;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), accelerometer=(self), gyroscope=(self), magnetometer=(self)"
    X-Frame-Options = "DENY"

[[redirects]]
    from = "/admin"
    to = "/index.html"
    status = 200
    force = true

[[redirects]]
    from = "/cocina"
    to = "/index.html"
    status = 200
    force = true

  [[redirects]]
  from = "/.agents"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.agents/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.trae"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.trae/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/models"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/models/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true
